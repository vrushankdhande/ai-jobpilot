# Documented relationships. Related skills earn PARTIAL credit only - never full credit.
# Python and Java, or TensorFlow and PyTorch, are deliberately NOT equivalent.
related_groups:   # symmetric
  - {members: [TensorFlow, PyTorch], credit: 0.5, reason: "Related deep learning frameworks, but not equivalent"}
  - {members: [Keras, TensorFlow], credit: 0.8, reason: "Keras is TensorFlow's high-level API"}
  - {members: [Keras, PyTorch], credit: 0.4, reason: "Related deep learning frameworks, but not equivalent"}
  - {members: [AWS, Azure, GCP], credit: 0.4, reason: "Major cloud platforms; services and tooling differ"}
  - {members: [PostgreSQL, MySQL, SQL Server, Oracle, SQLite], credit: 0.6, reason: "Relational SQL databases with different dialects and tooling"}
  - {members: [MongoDB, DynamoDB, Cassandra], credit: 0.35, reason: "NoSQL stores with different data models"}
  - {members: [Pinecone, FAISS, ChromaDB, Qdrant, Weaviate, Milvus, Vector Database], credit: 0.6, reason: "Vector search stores; APIs and operations differ"}
  - {members: [LangChain, LlamaIndex, LangGraph], credit: 0.6, reason: "LLM orchestration frameworks, not interchangeable APIs"}
